name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/backend-mvp-finalization]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: event_registration
          POSTGRES_USER: event_app
          POSTGRES_PASSWORD: event_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_app -d event_registration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-1234567890
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://event_app:event_password@127.0.0.1:5432/event_registration
      REDIS_URL: redis://127.0.0.1:6379/0
      PAYSTACK_SECRET_KEY: sk_test_ci_placeholder
      PAYSTACK_BASE_URL: https://api.paystack.co
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      DEFAULT_FROM_EMAIL: ci@example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Django system check
        working-directory: backend
        run: python manage.py check
      - name: Verify migration files
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        working-directory: backend
        run: python manage.py migrate --noinput
      - name: Run test suite
        working-directory: backend
        run: python manage.py test --verbosity 2
      - name: Production deployment checks
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_ALLOWED_HOSTS: api.example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://api.example.test
          CORS_ALLOWED_ORIGINS: https://app.example.test
          DJANGO_SECRET_KEY: ci-production-check-key-not-used-for-deployment-123456789
        run: python manage.py check --deploy
